<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon style candidates — Denník mimi</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { margin: 0; background: #f3f5f4; color: #1d2b2a; padding: 28px 30px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #63736f; font-size: 13.5px; margin-bottom: 22px; }
  h2 { font-size: 15px; margin: 26px 0 10px; text-transform: uppercase; letter-spacing: .06em; color: #50625e; }
  table { border-collapse: collapse; }
  th, td { padding: 8px 10px; }
  .grid { display: grid; grid-template-columns: 150px repeat(5, 104px); gap: 12px; align-items: center; }
  .gl { font-size: 14.5px; color: #41524f; text-align: left; }
  .colh { font-size: 12.5px; font-weight: 650; color: #1d2b2a; text-align: center; line-height: 1.25; }
  .colh small { display: block; font-weight: 400; color: #71817d; }
  .box { width: 78px; height: 78px; margin: 0 auto; border-radius: 18px; display: grid; place-items: center; }
  .theme-light .box { background: #fff; box-shadow: 0 1px 3px rgba(20,40,38,.09); border: 1px solid #e2e8e6; }
  .theme-dark .box { background: #1c2523; box-shadow: 0 1px 3px rgba(0,0,0,.5); border: 1px solid #2c3a37; color: #dfe9e6; }
  svg { display: block; }
  .section { border-radius: 18px; padding: 18px 20px 22px; margin-bottom: 22px; }
  .section.theme-light { background: #fff; border: 1px solid #e2e8e6; }
  .section.theme-dark { background: #131b1a; border: 1px solid #26322f; color: #dfe9e6; }
  .theme-dark h2 { color: #93a5a0; }
  .theme-dark .gl { color: #b7c4c0; }
  .theme-dark .colh { color: #e7efec; }
  /* in-app context mockups */
  .ctxrow { display: flex; gap: 18px; align-items: flex-end; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px dashed #d5dedb; }
  .theme-dark .ctxrow { border-top-color: #2c3a37; }
  .tiles { display: flex; gap: 8px; }
  .qtile { width: 60px; height: 52px; border-radius: 13px; display: grid; place-items: center; }
  .q-feed { background: rgba(240,160,70,.16); color: #d9832f; } .theme-dark .q-feed { color: #eda14f; }
  .q-sleep { background: rgba(140,160,250,.18); color: #6b7fe8; } .theme-dark .q-sleep { color: #93a5f6; }
  .q-diaper { background: rgba(70,190,160,.16); color: #2e9d7f; } .theme-dark .q-diaper { color: #5fc4a4; }
  .q-med { background: rgba(60,160,130,.15); color: #2a8f76; } .theme-dark .q-med { color: #57bda1; }
  .tabs-mini { display: flex; gap: 16px; padding: 8px 14px; border-radius: 16px; }
  .theme-light .tabs-mini { background: #fff; border: 1px solid #e2e8e6; }
  .theme-dark .tabs-mini { background: #18211f; border: 1px solid #2c3a37; }
  .tabs-mini span { display: grid; place-items: center; gap: 3px; font-size: 9.5px; color: #7c8b87; }
  .tabs-mini span.on { color: #1e8e6e; } .theme-dark .tabs-mini span.on { color: #45b78e; }
  .ctxlabel { font-size: 11.5px; color: #7c8b87; margin-bottom: 6px; }
</style></head>
<body>
<h1>Icon style candidates — core baby-log glyphs</h1>
<div class="sub">Same 8 glyphs in 5 drawing styles, on light and dark backgrounds, plus how they sit inside app chips and the tab bar. Pick a style (or mix) and I'll roll it into the app.</div>
<div id="app"></div>
<script>
const P = {
  bottle: "M9.5 2.5h5M10.5 2.5v3.2M13.5 2.5v3.2M9 8.6a3 3 0 0 1 1.5-2.7v-.2h3v.2A3 3 0 0 1 15 8.6v10.9a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2zM9 13h6",
  moon: "M20.5 13.3A8.5 8.5 0 1 1 10.7 3.5a7 7 0 0 0 9.8 9.8z",
  diaper: "M4.5 5.5h15v3.2c0 5.2-3.2 9.6-7.5 11.8C7.7 18.3 4.5 13.9 4.5 8.7zM4.5 8.7h15",
  bath: "M4 12.5h16v2.2a4.8 4.8 0 0 1-4.8 4.8H8.8A4.8 4.8 0 0 1 4 14.7zM7 12.5V6.2a2 2 0 0 1 4 0v1M16.5 9l1.5 1.5M19.5 8l1 1",
  walk: "M13.2 5.4a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2zM13 7.5l-2.5 4.5 3 1.8v5.7M10.5 12l-2.6-.5-1.9 2.6M16 13.8l-1.2-2",
  pill: "M10.6 3.6 3.6 10.6a5 5 0 0 0 7.1 7.1l7-7a5 5 0 0 0-7.1-7.1zM7.1 7.1l7 7",
  star: "M12 3.5l2.5 5.3 5.8.7-4.3 4 1.1 5.7L12 16.4l-5.1 2.8 1.1-5.7-4.3-4 5.8-.7z",
  heart: "M12 20.5S4 15.5 4 10.2A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 8 2.6c0 5.3-8 10.3-8 10.3z",
  home: "M3 10.6 12 3.2l9 7.4V20a1.5 1.5 0 0 1-1.5 1.5H15V15H9v6.5H4.5A1.5 1.5 0 0 1 3 20z",
  list: "M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01",
  chart: "M3.5 3.5v17h17M8 16.5v-5M13 16.5v-9M18 16.5v-6",
  bell: "M18 8.5a6 6 0 1 0-12 0c0 5.5-2 7-2 7h16s-2-1.5-2-7M10.3 19.5a2 2 0 0 0 3.4 0",
  bulb: "M9.5 18.5h5M11 21.5h2M12 2.5a6.5 6.5 0 0 0-3.6 11.9c.7.5 1.1 1.3 1.1 2.1v.5h5v-.5c0-.8.4-1.6 1.1-2.1A6.5 6.5 0 0 0 12 2.5z",
};
// closed fill shapes for duotone underlays / solid variants
const FILL = {
  bottle: "M9 8.6a3 3 0 0 1 1.5-2.7v-.2h3v.2A3 3 0 0 1 15 8.6v10.9a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z",
  moon: P.moon,
  diaper: "M4.5 5.5h15v3.2c0 5.2-3.2 9.6-7.5 11.8C7.7 18.3 4.5 13.9 4.5 8.7z",
  bath: "M4 12.5h16v2.2a4.8 4.8 0 0 1-4.8 4.8H8.8A4.8 4.8 0 0 1 4 14.7z",
  pill: "M10.6 3.6 3.6 10.6a5 5 0 0 0 7.1 7.1l7-7a5 5 0 0 0-7.1-7.1z",
  star: P.star,
  heart: P.heart,
};
const SOLID = {
  bottle: "M11 3h2a1 1 0 0 1 1 1v1.6h-4V4a1 1 0 0 1 1-1zM10.4 5.8h3.2l.3 1.9a3.1 3.1 0 0 1 1.1 2v9.7a2.6 2.6 0 0 1-2.6 2.6h-.8a2.6 2.6 0 0 1-2.6-2.6V9.7a3.1 3.1 0 0 1 1.1-2z",
  moon: P.moon,
  diaper: "M4.5 5.5h15v3.2c0 5.2-3.2 9.6-7.5 11.8C7.7 18.3 4.5 13.9 4.5 8.7z",
  bath: "M4 12.5h16v2.2a4.8 4.8 0 0 1-4.8 4.8H8.8A4.8 4.8 0 0 1 4 14.7z",
  pill: "M11.1 8H7a4 4 0 0 0 0 8h4.1zM12.9 8H17a4 4 0 0 1 0 8h-4.1z",
  star: P.star,
  heart: P.heart,
};
// glyphs needing stroke overlay even in solid (limbs, faucets)
const STROKE_OVER = { bath: true, walk: true };
const STYLES = [
  { name: "Line (current)", note: "2px round strokes — today's look", w: 2, cap: "round", join: "round" },
  { name: "Bold & soft", note: "3px, rounder, friendly", w: 3, cap: "round", join: "round" },
  { name: "Duotone", note: "soft fill + 2px line", w: 2, cap: "round", join: "round", duo: true },
  { name: "Solid", note: "filled silhouettes", solid: true },
  { name: "Thin & crisp", note: "1.5px, precise, airy", w: 1.5, cap: "round", join: "miter" },
];
const GLYPHS = [
  ["bottle", "Kŕmenie · Feed"], ["moon", "Spánok · Sleep"], ["diaper", "Plienka · Diaper"], ["bath", "Kúpeľ · Bath"],
  ["walk", "Prechádzka · Walk"], ["pill", "Lieky · Meds"], ["star", "Aktivita · Activity"], ["heart", "Obľúbené · Heart"],
];
function svg(name, st, size) {
  const s = size || 46;
  let inner = "";
  const strokeAttrs = `fill="none" stroke="currentColor" stroke-width="${st.w}" stroke-linecap="${st.cap}" stroke-linejoin="${st.join}"`;
  if (st.solid) {
    if (name === "walk") {
      inner += `<circle cx="13.2" cy="3.8" r="2" fill="currentColor"/><path d="M13 7.5l-2.5 4.5 3 1.8v5.7M10.5 12l-2.6-.5-1.9 2.6M16 13.8l-1.2-2" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>`;
      return `<svg width="${s}" height="${s}" viewBox="0 0 24 24">${inner}</svg>`;
    }
    const f = SOLID[name];
    if (f) inner += `<path d="${f}" fill="currentColor" fill-rule="nonzero"/>`;
    else inner += `<path d="${P[name]}" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
    if (STROKE_OVER[name]) inner += `<path d="${P[name]}" ${strokeAttrs}/>`;
    return `<svg width="${s}" height="${s}" viewBox="0 0 24 24">${inner}</svg>`;
  }
  if (st.duo && FILL[name]) inner += `<path d="${FILL[name]}" fill="currentColor" opacity=".3" stroke="none"/>`;
  if (st.duo && name === "walk") inner += `<circle cx="13.2" cy="3.8" r="1.7" fill="currentColor" opacity=".3"/>`;
  inner += `<path d="${P[name]}" ${strokeAttrs}/>`;
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24">${inner}</svg>`;
}
function blockClean(theme) {
  let h = `<div class="section theme-${theme}"><h2>${theme === "light" ? "Light background" : "Dark background"}</h2><div class="grid"><div></div>`;
  for (const st of STYLES) h += `<div class="colh">${st.name}<small>${st.note}</small></div>`;
  for (const [g, label] of GLYPHS) {
    h += `<div class="gl">${label}</div>`;
    for (const st of STYLES) h += `<div class="box">${svg(g, st)}</div>`;
  }
  h += `</div><div class="ctxrow">`;
  for (const st of STYLES) {
    let tiles = "";
    for (const [g, cls] of [["bottle", "q-feed"], ["moon", "q-sleep"], ["diaper", "q-diaper"], ["pill", "q-med"]])
      tiles += `<div class="qtile ${cls}">${svg(g, st, 30)}</div>`;
    let tabs = "";
    for (const [g, lab] of [["home", "Dnes"], ["list", "Záz"], ["chart", "Grafy"], ["bell", "Kontrola"]])
      tabs += `<span class="${g === "home" ? "on" : ""}">${svg(g, st, 24)}${lab}</span>`;
    h += `<div><div class="ctxlabel">${st.name}</div><div class="tiles">${tiles}</div><div class="tabs-mini" style="margin-top:8px">${tabs}</div></div>`;
  }
  return h + "</div></div>";
}
document.getElementById("app").innerHTML = blockClean("light") + blockClean("dark");
</script>
</body></html>
